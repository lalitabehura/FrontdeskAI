# Production stack: Caddy (HTTPS) -> nginx (dashboard + proxy) -> FastAPI, worker, PostgreSQL, Redis.
services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [edge]
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on: [backend]
    networks: [edge, internal]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://frontdesk:${POSTGRES_PASSWORD}@db:5432/frontdesk
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FORWARDED_ALLOW_IPS: "*"   # only reachable from the internal network via nginx
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [internal, egress]   # egress: Anthropic, Stripe, SMTP
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://frontdesk:${POSTGRES_PASSWORD}@db:5432/frontdesk
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on: [backend]
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frontdesk
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/backups]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk"]
      interval: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [internal]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  edge:        # Caddy <-> nginx
  egress:      # outbound calls from backend/worker
  internal:    # db, redis: no internet access at all
    internal: true
